{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candidate Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>

    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                🚀 Candidate Scraper
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">New Scrape</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'candidate_list' %}">All Candidates</a>
                    </li>
                </ul>
                
                <div class="d-flex">
                    <a href="{% url 'export_excel' %}" class="btn btn-light me-2">
                        📥 Download Excel
                    </a>
                    <a href="{% url 'clear_data' %}" class="btn btn-outline-light"
                       onclick="return confirm('Are you sure you want to delete ALL data?')">
                        🗑️ Clear Data
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <!-- ==================== END NAVBAR ==================== -->

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                {% if success %}
                    <div class="alert alert-success">{{ success }}</div>
                {% endif %}

                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">🔍 Scrape Candidates</h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <button type="submit" class="btn btn-success btn-lg mt-3">
                                🚀 Start Scraping
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
