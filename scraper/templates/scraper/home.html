{% load crispy_forms_tags %}
<!DOCTYPE html>
<html>
<head>
    <title>Candidate Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Candidate Profile Scraper (Apify + Django)</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Run Scrape & Save</button>
    </form>
    <a href="{% url 'export_excel' %}" class="btn btn-success mt-3">Download Latest Excel</a>
</body>
</html>
